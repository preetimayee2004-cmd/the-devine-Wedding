<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2EBDFE" />
    <!-- wedding:meta -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Sky colours from the very first paint, so nothing flashes white before the image arrives -->
    <style>
      html { background: #8fd8fb linear-gradient(#2ebdfe, #69cefe 25%, #ace4ff 50%, #b8ecfe 76%, #c0eafe) fixed; }
      html body { background: transparent; }
    </style>

    <!-- The opening: the sky and both hands are needed on the very first screen -->
    <link rel="preload" as="image" href="/art/sky.jpg" type="image/jpeg" fetchpriority="high" />
    <link rel="preload" as="image" href="/art/opening/hand-shiva.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/art/opening/hand-parvati.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/art/opening/hands-joined.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&family=Pinyon+Script&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
