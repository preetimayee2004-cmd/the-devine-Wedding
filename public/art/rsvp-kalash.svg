<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 140" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A brass kalash hanging on its chain, in fine antique-gold line on warm ivory: the chain, a ring,
       the bail, the rim, a rounded body tapering to the point a drop falls from -->
  <defs>
    <linearGradient id="k-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e2bd"/>
      <stop offset="0.38" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ecd5a6"/>
    </linearGradient>
  </defs>
  <!-- the chain -->
  <g stroke="#a8741f" stroke-width="1.1">
    <ellipse cx="40" cy="4" rx="2" ry="3.6"/>
    <path d="M40 8.4V11.2"/>
    <ellipse cx="40" cy="15" rx="2" ry="3.6"/>
    <path d="M40 19.4V22.2"/>
    <ellipse cx="40" cy="26" rx="2" ry="3.6"/>
    <path d="M40 30.4V32.4"/>
  </g>
  <circle cx="40" cy="35.4" r="2.8" stroke="#a8741f" stroke-width="1.2"/>
  <!-- the bail, from lug to lug over the ring -->
  <path d="M22.5 55C22.5 44 31 38.5 40 38.2 49 38.5 57.5 44 57.5 55" stroke="#a8741f" stroke-width="1.2"/>
  <circle cx="22.5" cy="56" r="1.6" fill="#e6c886" stroke="#a8741f" stroke-width="0.9"/>
  <circle cx="57.5" cy="56" r="1.6" fill="#e6c886" stroke="#a8741f" stroke-width="0.9"/>
  <!-- the body: shoulder, belly, and the tapering point -->
  <path d="M27 59C16 65 12.5 79 16.5 90 20 99.5 29 105 34.5 110.5 37.5 113.5 39.2 117 40 124.5 40.8 117 42.5 113.5 45.5 110.5 51 105 60 99.5 63.5 90 67.5 79 64 65 53 59Z" fill="url(#k-body)" stroke="#a8741f" stroke-width="1.2"/>
  <!-- the neck and rim -->
  <path d="M27 59C29 57.4 30 56.4 30 55H50C50 56.4 51 57.4 53 59" fill="#fbf2de" stroke="#a8741f" stroke-width="1.1"/>
  <ellipse cx="40" cy="54.6" rx="13.5" ry="2.8" fill="#fffaf0" stroke="#a8741f" stroke-width="1.1"/>
  <!-- bands of ornament round the shoulder: a fine double line and a row of beads -->
  <path d="M19.5 69.5Q40 74.5 60.5 69.5M18 74.5Q40 79.5 62 74.5" stroke="#b89554" stroke-width="0.8"/>
  <g fill="#c9a45c">
    <circle cx="24" cy="73.4" r="0.8"/><circle cx="28.5" cy="74.4" r="0.8"/><circle cx="33" cy="75.1" r="0.8"/>
    <circle cx="37.6" cy="75.5" r="0.8"/><circle cx="42.4" cy="75.5" r="0.8"/><circle cx="47" cy="75.1" r="0.8"/>
    <circle cx="51.5" cy="74.4" r="0.8"/><circle cx="56" cy="73.4" r="0.8"/>
  </g>
  <!-- a small lotus on the belly -->
  <g fill="#ecd49c" fill-opacity="0.8" stroke="#b08a46" stroke-width="0.7">
    <path d="M40 95C37.4 92.8 37.4 88.2 40 85.4 42.6 88.2 42.6 92.8 40 95Z"/>
    <path d="M40 95C36.4 94.6 33.8 92.2 33.2 89 36.6 89.4 38.8 91.6 40 95Z"/>
    <path d="M40 95C43.6 94.6 46.2 92.2 46.8 89 43.4 89.4 41.2 91.6 40 95Z"/>
  </g>
  <path d="M35 97.2H45" stroke="#b08a46" stroke-width="0.7"/>
  <!-- fine hatching down its right side, as an etching -->
  <g stroke="#c9a45c" stroke-width="0.5" opacity="0.85">
    <path d="M60 80L57.8 88"/>
    <path d="M58 84L55.8 93"/>
    <path d="M56 88L53.8 97"/>
    <path d="M54 92L51.8 100"/>
    <path d="M51.5 95L49.3 103"/>
    <path d="M61.5 73L59.3 81"/>
  </g>
  <!-- a soft light on the left of the belly, a fine line along the taper -->
  <path d="M21 83C21 77 23.5 72.5 27 70" stroke="#fffdf7" stroke-width="2" opacity="0.9"/>
  <path d="M34 106C36.5 109 38.5 113 39.4 119" stroke="#c9a45c" stroke-width="0.6" opacity="0.8"/>
</svg>
