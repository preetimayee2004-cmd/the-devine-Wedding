<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The Shivling in fine antique-gold line on warm ivory: a bel leaf on top, the tripundra and a
       saffron tilak, the jalahari round its base with its spout to the front, water flowing from it,
       on a low pedestal -->
  <defs>
    <linearGradient id="s-stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efdfc0"/>
      <stop offset="0.36" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e8d3a8"/>
    </linearGradient>
    <linearGradient id="s-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e5c8"/>
    </linearGradient>
  </defs>

  <!-- the pedestal -->
  <path d="M50 128H110L106 146C106 147.5 105 148.5 103.5 148.5H56.5C55 148.5 54 147.5 54 146Z" fill="url(#s-stone)" stroke="#a8741f" stroke-width="1.1"/>
  <path d="M53 136.5H107" stroke="#c9a45c" stroke-width="0.6" opacity="0.8"/>
  <!-- the jalahari: its rim band, then its top -->
  <path d="M16 106V114C16 121.7 44.7 128 80 128 115.3 128 144 121.7 144 114V106" fill="url(#s-stone)" stroke="#a8741f" stroke-width="1.2"/>
  <ellipse cx="80" cy="106" rx="64" ry="14" fill="url(#s-top)" stroke="#a8741f" stroke-width="1.2"/>
  <ellipse cx="80" cy="106" rx="54" ry="10.4" stroke="#c9a45c" stroke-width="0.7" opacity="0.85"/>
  <!-- the channel to the spout, and the spout to the front -->
  <path d="M74 115.6C74 120 75 125 76 129H84C85 125 86 120 86 115.6" fill="#f3e5c8" stroke="#a8741f" stroke-width="1.1"/>
  <path d="M76 129C76 132.6 77.6 135 80 135 82.4 135 84 132.6 84 129" fill="#f3e5c8" stroke="#a8741f" stroke-width="1.1"/>
  <path d="M80 116.5V131" stroke="#9cc0d8" stroke-width="1.3" opacity="0.9"/>
  <!-- the water, falling from the spout -->
  <path d="M80 135.5V145" stroke="#9cc0d8" stroke-width="1.4" opacity="0.85"/>

  <!-- the lingam -->
  <path d="M57 108V63C57 42.5 67 31 80 31 93 31 103 42.5 103 63V108C96 110.5 64 110.5 57 108Z" fill="url(#s-stone)" stroke="#a8741f" stroke-width="1.25"/>
  <!-- the front of the inner groove, passing before the lingam's foot -->
  <path d="M47 106C52 112 108 112 113 106" stroke="#c9a45c" stroke-width="0.7" opacity="0.85"/>
  <!-- a soft light down its left -->
  <path d="M63.5 92V64C63.5 52 67 44.5 72 40" stroke="#fffdf7" stroke-width="2.4" opacity="0.9"/>
  <!-- fine hatching down its right side and along the rim, as an etching -->
  <g stroke="#c9a45c" stroke-width="0.5" opacity="0.85">
    <path d="M98 46L96 54"/>
    <path d="M99.5 52L97.5 61"/>
    <path d="M100 60L98 70"/>
    <path d="M100 72L98 82"/>
    <path d="M100 84L98 94"/>
    <path d="M100 96L98 104"/>
    <path d="M124 113L122.4 120.5"/>
    <path d="M130 111.5L128.4 119"/>
    <path d="M136 109.6L134.4 117.1"/>
    <path d="M118 114.4L116.4 121.9"/>
  </g>
  <!-- the tripundra -->
  <path d="M64 57Q80 53.6 96 57M63.5 63.2Q80 59.8 96.5 63.2M64 69.4Q80 66 96 69.4" stroke="#b08a46" stroke-width="1.5"/>
  <!-- the saffron tilak -->
  <path d="M80 58.5C78 63 77.6 68 78.4 72 79 74.6 81 74.6 81.6 72 82.4 68 82 63 80 58.5Z" fill="#d9885a" stroke="#b3653c" stroke-width="0.6"/>

  <!-- the bel leaf on top: three leaflets on a short stem -->
  <path d="M80 31.5V26" stroke="#7f9a6f" stroke-width="0.9"/>
  <g fill="#a9c4a0" stroke="#7f9a6f" stroke-width="0.8">
    <path d="M80 26.5C75 23 74.4 14.5 80 8.5 85.6 14.5 85 23 80 26.5Z"/>
    <path d="M80 27C75.6 31 67 31 63.5 25 68.5 19.6 76 21 80 27Z"/>
    <path d="M80 27C84.4 31 93 31 96.5 25 91.5 19.6 84 21 80 27Z"/>
  </g>
  <path d="M80 25V12.5M79 27 67 25.4M81 27 93 25.4" stroke="#eef4e8" stroke-width="0.55"/>
</svg>
