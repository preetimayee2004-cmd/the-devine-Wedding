<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 196" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Nandi, seated, facing straight forward: fine antique-gold line, warm ivory, a muted saffron
       marigold garland and a small bell; on a plinth over fine gold curls and a small lotus -->
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbf2"/>
      <stop offset="1" stop-color="#f2e4c8"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d0a2"/>
      <stop offset="1" stop-color="#fbf2de"/>
    </linearGradient>
  </defs>

  <!-- the body: rounded shoulders down to the plinth -->
  <path d="M47 163C45 145 50 127 63 116 72 108 84 104 100 104 116 104 128 108 137 116 150 127 155 145 153 163Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1.1"/>
  <!-- the neck, behind the head -->
  <path d="M82 70C79 84 76 96 71 109 81 105 90 104 100 104 110 104 119 105 129 109 124 96 121 84 118 70Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1"/>
  <!-- the dewlap, folding down the chest -->
  <path d="M93 131C95 141 105 141 107 131" stroke="#b89554" stroke-width="0.75"/>
  <path d="M73 131C70 140 70 150 72 158M127 131C130 140 130 150 128 158" stroke="#c9a45c" stroke-width="0.6" opacity="0.7"/>

  <!-- the ears -->
  <path d="M84 66C76 60 65 60 56 65.5 64 72 75 73 84 70.5Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1"/>
  <path d="M116 66C124 60 135 60 144 65.5 136 72 125 73 116 70.5Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1"/>
  <path d="M80 66.5C74 64.8 68 65 63 66.5M120 66.5C126 64.8 132 65 137 66.5" stroke="#d9a07a" stroke-width="0.75" opacity="0.75"/>
  <!-- the horns, curving up and out -->
  <path d="M86 58C78 53 72 44 73.5 32 74.3 29.4 77 29.4 77.4 32 78.4 42 83.5 48.5 91 54Z" fill="url(#horn)" stroke="#a8741f" stroke-width="1"/>
  <path d="M114 58C122 53 128 44 126.5 32 125.7 29.4 123 29.4 122.6 32 121.6 42 116.5 48.5 109 54Z" fill="url(#horn)" stroke="#a8741f" stroke-width="1"/>

  <!-- the head -->
  <path d="M82 61C82 56 89 53 100 53 111 53 118 56 118 61 120 75 116 91 112 101 110 107 106 111 100 111 94 111 90 107 88 101 84 91 80 75 82 61Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1.1"/>
  <!-- the tripundra and a saffron dot -->
  <path d="M91.5 60.5Q100 58.6 108.5 60.5M92 63.2Q100 61.3 108 63.2M93 65.9Q100 64 107 65.9" stroke="#b08a46" stroke-width="0.85"/>
  <circle cx="100" cy="69.4" r="1.6" fill="#d98d58"/>
  <!-- the eyes, gentle -->
  <path d="M87.6 77C89.6 74.6 94.4 74.6 96.4 77 94.4 78.6 89.6 78.6 87.6 77Z" fill="#fffdf7" stroke="#8a6424" stroke-width="0.85"/>
  <path d="M112.4 77C110.4 74.6 105.6 74.6 103.6 77 105.6 78.6 110.4 78.6 112.4 77Z" fill="#fffdf7" stroke="#8a6424" stroke-width="0.85"/>
  <circle cx="92" cy="76.8" r="1.2" fill="#5e4214"/>
  <circle cx="108" cy="76.8" r="1.2" fill="#5e4214"/>
  <path d="M95 86.5C97 88 103 88 105 86.5" stroke="#c9a45c" stroke-width="0.6" opacity="0.7"/>
  <!-- the muzzle and nostrils -->
  <path d="M89.5 101C89.5 96.4 94.4 94.4 100 94.4 105.6 94.4 110.5 96.4 110.5 101 110.5 105.8 105.8 109.3 100 109.3 94.2 109.3 89.5 105.8 89.5 101Z" fill="#f5e3c6" stroke="#a8741f" stroke-width="0.95"/>
  <path d="M94.6 101.6C95.6 99.8 97.6 100 97.8 101.9M105.4 101.6C104.4 99.8 102.4 100 102.2 101.9" stroke="#8a6424" stroke-width="0.85"/>

  <!-- the marigold garland, round the neck and down onto the chest -->
  <g fill="#ecbd84" stroke="#b9844a" stroke-width="0.55">
    <circle cx="77" cy="99.6" r="3.3"/>
    <circle cx="78.4" cy="105.8" r="3.3"/>
    <circle cx="80.8" cy="111.6" r="3.3"/>
    <circle cx="84.3" cy="116.6" r="3.3"/>
    <circle cx="88.8" cy="120.4" r="3.3"/>
    <circle cx="94.2" cy="122.8" r="3.3"/>
    <circle cx="100" cy="123.6" r="3.3"/>
    <circle cx="105.8" cy="122.8" r="3.3"/>
    <circle cx="111.2" cy="120.4" r="3.3"/>
    <circle cx="115.7" cy="116.6" r="3.3"/>
    <circle cx="119.2" cy="111.6" r="3.3"/>
    <circle cx="121.6" cy="105.8" r="3.3"/>
    <circle cx="123" cy="99.6" r="3.3"/>
  </g>
  <g fill="#f6d9b0">
    <circle cx="76.3" cy="98.9" r="1"/><circle cx="77.7" cy="105.1" r="1"/><circle cx="80.1" cy="110.9" r="1"/>
    <circle cx="83.6" cy="115.9" r="1"/><circle cx="88.1" cy="119.7" r="1"/><circle cx="93.5" cy="122.1" r="1"/>
    <circle cx="99.3" cy="122.9" r="1"/><circle cx="105.1" cy="122.1" r="1"/><circle cx="110.5" cy="119.7" r="1"/>
    <circle cx="115" cy="115.9" r="1"/><circle cx="118.5" cy="110.9" r="1"/><circle cx="120.9" cy="105.1" r="1"/>
    <circle cx="122.3" cy="98.9" r="1"/>
  </g>
  <!-- a small bell from the garland -->
  <path d="M100 127V129.6" stroke="#a8741f" stroke-width="0.85"/>
  <path d="M96.6 136C96.6 132 98.1 129.6 100 129.6 101.9 129.6 103.4 132 103.4 136Z" fill="#e6c886" stroke="#a8741f" stroke-width="0.85"/>
  <circle cx="100" cy="137.3" r="1" fill="#a8741f"/>

  <!-- the forelegs, folded under, the hooves tucked toward the middle -->
  <path d="M51 163C51 156.5 57 152 66 152 77 152 86 155.5 90.5 160.5L91 163Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1"/>
  <path d="M149 163C149 156.5 143 152 134 152 123 152 114 155.5 109.5 160.5L109 163Z" fill="url(#ivory)" stroke="#a8741f" stroke-width="1"/>
  <path d="M82 156.5C86 157 89 159.4 90 162.4M118 156.5C114 157 111 159.4 110 162.4" stroke="#8a6424" stroke-width="0.8"/>
  <path d="M58 158C62 156 67 156 71 157M142 158C138 156 133 156 129 157" stroke="#c9a45c" stroke-width="0.6" opacity="0.8"/>

  <!-- the plinth -->
  <path d="M40 163H160V170.5C160 172 159 173 157.5 173H42.5C41 173 40 172 40 170.5Z" fill="#fbf3e2" stroke="#a8741f" stroke-width="1"/>
  <path d="M45 167.4H155" stroke="#c9a45c" stroke-width="0.55" opacity="0.8"/>

  <!-- beneath it: fine gold curls out from a small lotus -->
  <path d="M89 187C76 188 63 181 49 184 41 186 35 190 29 188M111 187C124 188 137 181 151 184 159 186 165 190 171 188" stroke="#b89554" stroke-width="0.75" opacity="0.8"/>
  <circle cx="84" cy="186.8" r="0.9" fill="#b89554"/>
  <circle cx="116" cy="186.8" r="0.9" fill="#b89554"/>
  <g fill="#e9d29a" fill-opacity="0.55" stroke="#a8741f" stroke-width="0.7">
    <path d="M100 192C95.6 191.5 92 188.7 91 184.6 95.2 185 98.4 187.8 100 192Z"/>
    <path d="M100 192C104.4 191.5 108 188.7 109 184.6 104.8 185 101.6 187.8 100 192Z"/>
    <path d="M100 192C97.8 189 97 185.2 97.8 181.4 99.6 184.2 100.4 188 100 192Z"/>
    <path d="M100 192C102.2 189 103 185.2 102.2 181.4 100.4 184.2 99.6 188 100 192Z"/>
    <path d="M100 192C98.6 187.8 98.8 182.8 100 178 101.2 182.8 101.4 187.8 100 192Z"/>
  </g>
</svg>
