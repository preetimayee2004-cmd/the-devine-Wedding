<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 256" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ganesha seated for the Ganesh Pujan, after the couple's picture: a tall gold mukut with a red
       jewel, broad ears, a red tilak, his trunk curling to his left, a saffron shawl over his
       shoulders, two raised hands each holding a saffron bud, gold necklaces, a jewelled belt and a
       broad saffron dhoti, his feet crossed in front. Drawn as vector, so it stays crisp at any size. -->
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d77a"/>
      <stop offset="0.45" stop-color="#d9a637"/>
      <stop offset="1" stop-color="#a8741f"/>
    </linearGradient>
    <linearGradient id="g-gold-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dd86"/>
      <stop offset="1" stop-color="#b8862a"/>
    </linearGradient>
    <linearGradient id="g-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdebd6"/>
      <stop offset="1" stop-color="#efcba6"/>
    </linearGradient>
    <linearGradient id="g-saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#e9640f"/>
    </linearGradient>
    <linearGradient id="g-saffron-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f27a1a"/>
      <stop offset="1" stop-color="#c94b0c"/>
    </linearGradient>
    <linearGradient id="g-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdeedd"/>
      <stop offset="1" stop-color="#f1d0ad"/>
    </linearGradient>
    <linearGradient id="g-fade" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="118">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="g-from-bridge" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="256">
      <rect width="200" height="256" fill="url(#g-fade)"/>
    </mask>
    <radialGradient id="g-bud" cx="0.4" cy="0.65" r="0.7">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#f2761c"/>
      <stop offset="1" stop-color="#c7361a"/>
    </radialGradient>
  </defs>

  <!-- ── the raised arms, behind: forearms up to the hands, gold bangles ── -->
  <g stroke="#b9875a" stroke-width="1.2">
    <path d="M48 176C38 172 30 162 28 150L24 140C23 137 27 135 30 137L40 150C44 158 50 164 58 166Z" fill="url(#g-skin)"/>
    <path d="M152 176C162 172 170 162 172 150L176 140C177 137 173 135 170 137L160 150C156 158 150 164 142 166Z" fill="url(#g-skin)"/>
  </g>
  <g fill="url(#g-gold)" stroke="#9c6b1e" stroke-width="0.8">
    <path d="M24 146.5C27 144 33 143 36 146L37.5 150C34 147.5 28.5 148 25.5 150.6Z"/>
    <path d="M176 146.5C173 144 167 143 164 146L162.5 150C166 147.5 171.5 148 174.5 150.6Z"/>
  </g>
  <!-- the hands, each closed round a saffron bud -->
  <g fill="url(#g-skin)" stroke="#b9875a" stroke-width="1.1">
    <path d="M17 133C15 125 20 119 27 119 34 119 38 124 37 131 36 138 31 142 25 142 20 142 18 138 17 133Z"/>
    <path d="M183 133C185 125 180 119 173 119 166 119 162 124 163 131 164 138 169 142 175 142 180 142 182 138 183 133Z"/>
  </g>
  <g stroke="#b9875a" stroke-width="0.8">
    <path d="M20 128H34M20 133H34M22 138H33"/>
    <path d="M180 128H166M180 133H166M178 138H167"/>
  </g>
  <g fill="url(#g-bud)" stroke="#a83416" stroke-width="0.9">
    <path d="M27 120C20 116 19 107 23 99 25 95 27 92 27 88 29 92 31 95 32 99 35 107 34 116 27 120Z"/>
    <path d="M173 120C180 116 181 107 177 99 175 95 173 92 173 88 171 92 169 95 168 99 165 107 166 116 173 120Z"/>
  </g>
  <g fill="#5a7a3a">
    <path d="M27 121 21 118C23 122 25 123 27 122Z"/>
    <path d="M27 121 33 118C31 122 29 123 27 122Z"/>
    <path d="M173 121 167 118C169 122 171 123 173 122Z"/>
    <path d="M173 121 179 118C177 122 175 123 173 122Z"/>
  </g>

  <!-- ── the dhoti: broad saffron folds over the crossed legs ── -->
  <path d="M30 222C20 214 18 199 30 190 46 179 76 182 100 190 124 182 154 179 170 190 182 199 180 214 170 222 158 232 132 236 112 232L100 230 88 232C68 236 42 232 30 222Z" fill="url(#g-saffron)" stroke="#b9500e" stroke-width="1.3"/>
  <g stroke="#c4560e" stroke-width="1" opacity="0.85">
    <path d="M36 200C50 196 66 198 80 204M34 212C48 207 66 209 84 216M120 204C134 198 150 196 164 200M116 216C134 209 152 207 166 212"/>
  </g>
  <path d="M30 222C42 230 66 234 88 230M170 222C158 230 134 234 112 230" stroke="url(#g-gold)" stroke-width="3"/>
  <!-- the feet, crossed in front -->
  <g fill="url(#g-skin)" stroke="#b9875a" stroke-width="1.1">
    <path d="M78 232C76 225 82 220 92 221L104 224C108 226 108 232 104 234 96 238 84 238 78 232Z"/>
    <path d="M122 232C124 225 118 220 108 221L96 224C92 226 92 232 96 234 104 238 116 238 122 232Z"/>
  </g>
  <g stroke="#b9875a" stroke-width="0.8">
    <path d="M82 233C84 235 86 235.6 88 235.6M88 234.4 91 236M117 233C115 235 113 235.6 111 235.6M111 234.4 108 236"/>
  </g>
  <g fill="#e3a07a" opacity="0.6">
    <ellipse cx="86" cy="228" rx="5" ry="2.4"/>
    <ellipse cx="114" cy="228" rx="5" ry="2.4"/>
  </g>
  <!-- the middle fold falling between the feet -->
  <path d="M92 188C94 202 96 214 100 226 104 214 106 202 108 188Z" fill="url(#g-saffron-deep)" stroke="#b9500e" stroke-width="1"/>

  <!-- ── the belly and chest ── -->
  <path d="M60 150C56 166 58 184 70 194 80 201 120 201 130 194 142 184 144 166 140 150 132 138 118 132 100 132 82 132 68 138 60 150Z" fill="url(#g-skin)" stroke="#b9875a" stroke-width="1.2"/>
  <path d="M100 184C102 182 104 184 102 186" stroke="#c99a70" stroke-width="1"/>
  <!-- the jewelled belt -->
  <path d="M64 188C80 196 120 196 136 188L134 196C118 203 82 203 66 196Z" fill="url(#g-gold)" stroke="#9c6b1e" stroke-width="0.9"/>
  <circle cx="100" cy="197" r="5.2" fill="#c72b2b" stroke="#9c6b1e" stroke-width="1"/>
  <circle cx="99" cy="195.6" r="1.6" fill="#ffd7c4" opacity="0.8"/>
  <g fill="#f6dd86" stroke="#9c6b1e" stroke-width="0.5">
    <circle cx="80" cy="196" r="1.5"/><circle cx="88" cy="198.2" r="1.5"/><circle cx="112" cy="198.2" r="1.5"/><circle cx="120" cy="196" r="1.5"/>
  </g>

  <!-- ── the saffron shawl over the shoulders, falling at both sides ── -->
  <path d="M58 128C46 134 40 150 42 168 44 182 50 190 58 192 62 176 62 158 70 140 76 132 82 128 86 127Z" fill="url(#g-saffron-deep)" stroke="#b9500e" stroke-width="1.2"/>
  <path d="M142 128C154 134 160 150 158 168 156 182 150 190 142 192 138 176 138 158 130 140 124 132 118 128 114 127Z" fill="url(#g-saffron-deep)" stroke="#b9500e" stroke-width="1.2"/>
  <g stroke="#ffb35a" stroke-width="1" opacity="0.7">
    <path d="M52 146C50 158 50 170 54 182M148 146C150 158 150 170 146 182"/>
  </g>
  <path d="M58 192C54 180 52 164 56 150M142 192C146 180 148 164 144 150" stroke="url(#g-gold)" stroke-width="2.2"/>

  <!-- ── the necklaces: two gold strands, a pendant ── -->
  <path d="M74 136C80 154 120 154 126 136" stroke="url(#g-gold)" stroke-width="2.4"/>
  <path d="M70 138C76 166 124 166 130 138" stroke="url(#g-gold)" stroke-width="1.8"/>
  <g fill="#f6dd86" stroke="#9c6b1e" stroke-width="0.5">
    <circle cx="80" cy="152" r="1.6"/><circle cx="88" cy="157.5" r="1.6"/><circle cx="112" cy="157.5" r="1.6"/><circle cx="120" cy="152" r="1.6"/>
  </g>
  <path d="M100 160C96 164 96 170 100 175 104 170 104 164 100 160Z" fill="url(#g-gold)" stroke="#9c6b1e" stroke-width="0.9"/>
  <circle cx="100" cy="167.5" r="2.2" fill="#c72b2b"/>

  <!-- ── the ears ── -->
  <path d="M70 76C58 70 40 72 30 82 24 90 26 104 32 114 38 124 50 130 62 128 70 126 74 118 74 108Z" fill="url(#g-skin)" stroke="#b9875a" stroke-width="1.3"/>
  <path d="M130 76C142 70 160 72 170 82 176 90 174 104 168 114 162 124 150 130 138 128 130 126 126 118 126 108Z" fill="url(#g-skin)" stroke="#b9875a" stroke-width="1.3"/>
  <path d="M66 84C58 80 46 82 40 89 36 96 38 106 43 113 48 119 56 121 63 118Z" fill="#f4b9a6" opacity="0.75"/>
  <path d="M134 84C142 80 154 82 160 89 164 96 162 106 157 113 152 119 144 121 137 118Z" fill="#f4b9a6" opacity="0.75"/>
  <g stroke="url(#g-gold)" stroke-width="1.6">
    <path d="M32 112C38 122 48 127 58 127M168 112C162 122 152 127 142 127"/>
  </g>

  <!-- ── the head ── -->
  <path d="M68 78C66 92 70 106 78 116 82 121 86 124 88 128L112 128C114 124 118 121 122 116 130 106 134 92 132 78 124 70 76 70 68 78Z" fill="url(#g-skin)" stroke="#b9875a" stroke-width="1.3"/>
  <!-- the cheeks, a blush -->
  <g fill="#f3a99a" opacity="0.45">
    <ellipse cx="80" cy="108" rx="7" ry="4.5"/>
    <ellipse cx="120" cy="108" rx="7" ry="4.5"/>
  </g>
  <!-- the eyes: gentle, a dark iris, a fine lash line -->
  <g stroke="#3d2614" stroke-width="1.1">
    <path d="M80 97C83 93.4 89 93.4 92 97 89 99.6 83 99.6 80 97Z" fill="#fffaf2"/>
    <path d="M120 97C117 93.4 111 93.4 108 97 111 99.6 117 99.6 120 97Z" fill="#fffaf2"/>
  </g>
  <circle cx="86.4" cy="96.6" r="2.3" fill="#2e1a0e"/>
  <circle cx="113.6" cy="96.6" r="2.3" fill="#2e1a0e"/>
  <circle cx="87.2" cy="95.8" r="0.7" fill="#fff"/>
  <circle cx="114.4" cy="95.8" r="0.7" fill="#fff"/>
  <path d="M79 91C83 88.5 89 88.5 93 90.5M121 91C117 88.5 111 88.5 107 90.5" stroke="#3d2614" stroke-width="1.2"/>
  <!-- the tilak -->
  <path d="M96 76C96 82 98 86 100 88 102 86 104 82 104 76" stroke="#c72b2b" stroke-width="1.6"/>
  <circle cx="100" cy="84" r="2.6" fill="#d8362e"/>
  <!-- the tusk, at his right -->
  <path d="M88 120C85 125 82 130 80 136 84 132 88 128 92 124Z" fill="#fffaf0" stroke="#b9875a" stroke-width="1"/>
  <!-- the trunk: down from between the eyes, curling to his left; its outline fades in from the bridge -->
  <path d="M100 96C99 110 98 126 100 138 102 150 108 158 117 161 124 163 130 159 130 153 130 147 124 145 120 147 117 149 118 154 122 154" stroke="#b9875a" stroke-width="15.4" mask="url(#g-from-bridge)"/>
  <path d="M100 96C99 110 98 126 100 138 102 150 108 158 117 161 124 163 130 159 130 153 130 147 124 145 120 147 117 149 118 154 122 154" stroke="url(#g-trunk)" stroke-width="13"/>
  <g stroke="#d4a985" stroke-width="0.9">
    <path d="M94.6 114Q99 116 104.6 114M94.4 121Q99 123 104.4 121M94.6 128Q99.2 130 104.8 128M95.4 135Q100 137 105.6 135M97 142Q101.6 144 107 141.6"/>
  </g>
  <path d="M95 104C94.6 110 94.6 116 95 120" stroke="#fffaf2" stroke-width="2" opacity="0.8"/>

  <!-- ── the mukut: a tall gold crown, a red jewel, pearls ── -->
  <path d="M68 78C70 70 76 66 82 64H118C124 66 130 70 132 78C120 74 80 74 68 78Z" fill="url(#g-gold)" stroke="#9c6b1e" stroke-width="1.1"/>
  <!-- its broad, rounded body with jagged points along the top -->
  <path d="M71 68C69 56 71 46 76 39L74 32 81 35C83 31 86 28 89 27L89 20 94 23C96 18 98 13 100 7 102 13 104 18 106 23L111 20 111 27C114 28 117 31 119 35L126 32 124 39C129 46 131 56 129 68Z" fill="url(#g-gold-v)" stroke="#9c6b1e" stroke-width="1.2"/>
  <!-- bands of filigree -->
  <g stroke="#9c6b1e" stroke-width="0.9" opacity="0.8">
    <path d="M73 59C86 55 114 55 127 59M77 44C88 40 112 40 123 44"/>
  </g>
  <g stroke="#fff3c8" stroke-width="0.8" opacity="0.85">
    <path d="M78 51C82 49 86 49 90 51M110 51C114 49 118 49 122 51M84 36C88 34 92 34 96 36M104 36C108 34 112 34 116 36"/>
  </g>
  <!-- the red jewel in a gold setting, two green stones, a row of pearls -->
  <ellipse cx="100" cy="50" rx="8.6" ry="10" fill="#e6b84a" stroke="#9c6b1e" stroke-width="1"/>
  <ellipse cx="100" cy="50" rx="5.6" ry="7" fill="#c72b2b" stroke="#8a1e1e" stroke-width="0.8"/>
  <ellipse cx="98.4" cy="47.4" rx="1.6" ry="2.2" fill="#ffd7c4" opacity="0.8"/>
  <g fill="#2f7d5a" stroke="#9c6b1e" stroke-width="0.6">
    <circle cx="83" cy="51" r="2.6"/><circle cx="117" cy="51" r="2.6"/>
  </g>
  <g fill="#c72b2b" stroke="#9c6b1e" stroke-width="0.5">
    <circle cx="100" cy="30" r="2.2"/><circle cx="87" cy="38" r="1.6"/><circle cx="113" cy="38" r="1.6"/>
  </g>
  <g fill="#fff6e0" stroke="#b8862a" stroke-width="0.5">
    <circle cx="76" cy="64" r="1.8"/><circle cx="82.5" cy="62.6" r="1.8"/><circle cx="89" cy="61.8" r="1.8"/><circle cx="95.5" cy="61.4" r="1.8"/><circle cx="104.5" cy="61.4" r="1.8"/><circle cx="111" cy="61.8" r="1.8"/><circle cx="117.5" cy="62.6" r="1.8"/><circle cx="124" cy="64" r="1.8"/>
  </g>
  <circle cx="100" cy="7.5" r="2.6" fill="#f6dd86" stroke="#9c6b1e" stroke-width="0.8"/>
</svg>
